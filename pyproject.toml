[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capservice"
version = "1.0.0"
description = "HTTP microservice that adds animated captions to videos with pycaps"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.36",
    "structlog>=24.4.0",
    "playwright>=1.48.0",
    "pycaps[faster-whisper] @ git+https://github.com/francozanardi/pycaps.git@v0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-timeout>=2.3.0",
    "gTTS>=2.5.0",
]

[project.scripts]
capservice = "capservice.__main__:main"

[tool.setuptools.packages.find]
include = ["capservice*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
timeout = 30
markers = [
    "integration: requires ffmpeg, pycaps, whisper and a generated Spanish clip",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
